[project]
name = "stochastic-sampling-dimensionality-gap"
version = "0.1.0"
description = "Code and data for 'Where Cross-Question Structure in LLM Errors Comes From'."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Izhar Ali", email = "aliizh94@rowan.edu" },
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "factor-analyzer>=0.5.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.0",
    "tueplots>=0.2.4",
]

[tool.pytest.ini_options]
testpaths = ["src", "scripts"]
