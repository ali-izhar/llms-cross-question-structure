[project]
name = "llms-cross-question-structure"
version = "0.1.0"
description = "Code and data for 'Where Cross-Question Structure in LLM Errors Comes From'."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Izhar Ali", email = "aliizh94@rowan.edu" },
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "huggingface-hub>=1.10.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "tokenizers>=0.22.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["src", "scripts"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # drivers put src/ and scripts/ on sys.path before importing project modules
